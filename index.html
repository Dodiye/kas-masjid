<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kas Pembangunan Masjid Nurul Iman Senggigi</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f3f7f4;--card:#fff;--tx:#14261c;--mu:#5d6f65;--pr:#157347;--in:#157347;--out:#c62828;--bd:#d9e4dd}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1712;--card:#17231c;--tx:#e6f1ea;--mu:#9bb0a3;--pr:#3fb27a;--in:#4cc98a;--out:#ff7b72;--bd:#28392f}}
:root[data-theme="dark"]{--bg:#0e1712;--card:#17231c;--tx:#e6f1ea;--mu:#9bb0a3;--pr:#3fb27a;--in:#4cc98a;--out:#ff7b72;--bd:#28392f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:84px}
header{background:var(--pr);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;line-height:1.2}header small{opacity:.85;font-size:13px}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn.out{background:var(--out)}.btn.ghost{background:transparent;color:inherit;border:1px solid currentColor}
header .btn{padding:8px 12px;font-size:14px}
main{max-width:860px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:13px;color:var(--mu)}.v{font-size:21px;font-weight:700}
.in{color:var(--in)}.ot{color:var(--out)}
.bar{height:12px;background:var(--bd);border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:12px 2px;font-size:13px;color:var(--mu)}nav button.on{color:var(--pr);font-weight:700}
label{display:block;font-size:14px;color:var(--mu);margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
table{width:100%;border-collapse:collapse;font-size:15px}th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:left}
th{color:var(--mu);font-weight:600;font-size:13px}td.r,th.r{text-align:right}
.tw{overflow-x:auto}
.item{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item:last-child{border:0}.item small{color:var(--mu);display:block}
.rt{display:flex;align-items:center;gap:8px;margin:6px 0}.rt b{width:92px;font-size:14px}.rt .bar{flex:1}.rt span{width:110px;text-align:right;font-size:14px}
h2{font-size:18px;margin:0 0 8px}
.x{background:none;border:0;color:var(--out);font-size:14px;padding:0}
.sign{display:none}
 html{-webkit-text-size-adjust:100%}button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{padding:12px 14px}header h1{font-size:16px}header .btn{white-space:nowrap;font-size:13px}
.hero{background:var(--pr);color:#fff;border:0}.hero .k{color:#fff;opacity:.9}.hero .v{font-size:30px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .card{margin-bottom:10px}
.big{display:block;width:100%;padding:16px;font-size:18px;margin-bottom:10px}
.x{padding:10px 0 2px;font-size:15px}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
nav button{min-height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}nav button span{font-size:21px;line-height:1}
.rt2{margin:12px 0}.rt2 .t{display:flex;justify-content:space-between;font-size:15px;margin-bottom:4px}
.prv{font-size:15px;color:var(--pr);font-weight:600;min-height:22px;margin-top:4px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.md{background:var(--card);color:var(--tx);border-radius:16px;padding:18px;max-width:440px;width:100%;max-height:88vh;overflow:auto}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}.card{border:0}.sign{display:flex;justify-content:space-around;margin-top:50px;text-align:center}.kop{display:block!important}}
.kop{display:none;text-align:center;margin-bottom:10px}
</style>
</head>
<body>
<header>
 <div><h1>Kas Pembangunan Masjid<br>Nurul Iman Senggigi</h1><small id="mode"></small></div>
 <button class="btn ghost" id="lg" onclick="toggleLogin()"></button>
</header>
<main id="app"></main>
<nav id="nav"></nav>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
<script>
/* ====== ISI DUA BARIS INI (lihat PANDUAN.md) ====== */
const SUPABASE_URL='ISI_URL_PROYEK_ANDA',SUPABASE_KEY='ISI_ANON_PUBLIC_KEY_ANDA';
/* ================================================== */
const RT=['RT 01','RT 02','RT 03','RT 04','RT 05','RT 06','Luar Dusun/Umum'];
const CI=['Infaq/Sedekah Warga','Donatur Tetap','Donasi Perantau','Kotak Amal/Jumat','Hasil Usaha/Lelang','Bantuan/Hibah','Lainnya'];
const CO=['Material','Upah Tukang/Pekerja','Konsumsi Pekerja','Peralatan','Transportasi','Perizinan/Administrasi','Listrik & Air','Lainnya'];
const BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const KEY='kas_masjid_nurul_iman_v1';
let sb=null,ready=false,err='',S={target:500000000,tx:[]},admin=false,view='dash',F={from:'',to:'',rt:'',cat:''};
const today=()=>new Date().toISOString().slice(0,10);
const num=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
const rp=n=>'Rp '+num(n);
const tgl=d=>{const[y,m,x]=d.split('-');return +x+' '+BL[m-1]+' '+y};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function db(f){try{const{error}=await f();if(error)throw error;return true}catch(e){await info('Gagal menyimpan',esc(e.message||'Pastikan Anda sudah masuk sebagai bendahara.'));return false}}
async function refresh(){
 if(!sb)return;
 try{const r=await sb.from(admin?'transaksi':'transaksi_publik').select('*').order('tanggal',{ascending:false});if(r.error)throw r.error;
 S.tx=r.data.map(x=>({id:x.id,t:x.tipe,d:x.tanggal,a:Number(x.nominal),rt:x.rt==null?'':x.rt,c:x.kategori,n:x.nama,k:x.keterangan||'',an:!!x.anonim}));
 const g=await sb.from('pengaturan').select('target').eq('id',1).maybeSingle();if(g.data)S.target=Number(g.data.target);err=''}catch(e){err=e.message||'tidak diketahui'}
 ready=true;render()}
async function init(){
 if(!window.supabase||SUPABASE_URL.startsWith('ISI')){err='Aplikasi belum disambungkan ke Supabase. Isi SUPABASE_URL dan SUPABASE_KEY di bagian atas berkas (lihat PANDUAN.md).';ready=true;render();return}
 sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
 const{data}=await sb.auth.getSession();admin=!!data.session;
 sb.auth.onAuthStateChange((ev,ses)=>{if(!!ses!==admin){admin=!!ses;refresh()}});
 await refresh();
 const tick=()=>{if(!document.hidden&&!fo&&!document.querySelector('.ov'))refresh()};
 document.addEventListener('visibilitychange',tick);setInterval(tick,30000)}
const sum=(l,t)=>l.filter(x=>x.t==t).reduce((a,x)=>a+x.a,0);
const nm=x=>x.t=='in'&&x.an&&!admin?'Hamba Allah':x.n;
function filt(){return S.tx.filter(x=>(!F.from||x.d>=F.from)&&(!F.to||x.d<=F.to)&&(!F.rt||x.rt==F.rt&&x.t=='in')&&(!F.cat||x.c==F.cat||(x.k&&0))).sort((a,b)=>a.d<b.d?-1:1)}
/* Dialog di dalam halaman (pengganti prompt/alert/confirm yang diblokir di halaman terbit) */
function dlg(o){return new Promise(res=>{const ov=document.createElement('div');ov.className='ov';
 ov.innerHTML=`<div class="md"><h2>${o.t||''}</h2><div>${o.b||''}</div><div class="row" style="margin-top:14px">${o.c===false?'':'<button class="btn ghost" style="color:var(--pr)" data-n>Batal</button>'}<button class="btn" data-y>${o.y||'OK'}</button></div></div>`;
 document.body.appendChild(ov);const close=v=>{ov.remove();res(v)};
 ov.querySelector('[data-y]').onclick=()=>close(o.get?o.get(ov):true);
 const n=ov.querySelector('[data-n]');if(n)n.onclick=()=>close(null);
 ov.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT')ov.querySelector('[data-y]').click()});
 const f=ov.querySelector('input,textarea');if(f)f.focus()})}
const info=(t,b)=>dlg({t,b:'<p>'+b+'</p>',c:false});
const ask=(t,b)=>dlg({t,b:'<p>'+b+'</p>',y:'Ya'}).then(v=>!!v);
function copyBox(t,note,text,link){return dlg({t,c:false,y:'Salin',
 b:`<p class="k">${note}</p><textarea id="bk" rows="8" readonly>${esc(text)}</textarea>${link?`<a class="btn" style="display:block;text-align:center;margin-top:10px;text-decoration:none" href="${link}" target="_blank" rel="noopener">Buka WhatsApp</a>`:''}`,
 get:o=>{const x=o.querySelector('#bk');x.select();try{navigator.clipboard.writeText(x.value)}catch(e){try{document.execCommand('copy')}catch(e2){}}return true}})}
async function toggleLogin(){
 if(admin){await sb.auth.signOut();admin=false;if(view==='set')view='dash';await refresh();return}
 if(!sb){info('Belum tersambung','Isi pengaturan Supabase terlebih dahulu (lihat PANDUAN.md).');return}
 const v=await dlg({t:'Masuk Bendahara',b:'<label>Email</label><input type="email" id="em" autocomplete="username"><label>Kata sandi</label><input type="password" id="pw" autocomplete="current-password">',y:'Masuk',get:o=>({e:o.querySelector('#em').value.trim(),p:o.querySelector('#pw').value})});
 if(!v)return;
 const{error}=await sb.auth.signInWithPassword({email:v.e,password:v.p});
 if(error)info('Gagal masuk','Email atau kata sandi salah.')}
let fo=false;
function newTx(t){view=t=='in'?'masuk':'keluar';fo=true;render();scrollTo(0,0)}
function go(v){view=v;fo=false;render();scrollTo(0,0)}
function render(){
 document.getElementById('mode').textContent=admin?'Mode Bendahara':'Tampilan Warga (lihat saja)';
 document.getElementById('lg').textContent=admin?'Keluar':'Masuk Bendahara';
 const tabs=[['dash','🏠','Ringkasan'],['masuk','📥','Kas Masuk'],['keluar','📤','Kas Keluar'],['lap','📄','Laporan']];if(admin)tabs.push(['set','⚙️','Atur']);
 document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${view==t[0]?'on':''}" onclick="go('${t[0]}')"><span>${t[1]}</span>${t[2]}</button>`).join('');
 document.getElementById('app').innerHTML=(err?`<div class="card ot"><b>Gagal memuat data:</b> ${esc(err)}</div>`:'')+(ready?{dash,masuk:()=>list('in'),keluar:()=>list('out'),lap,set}[view]():'<div class="card">Memuat data…</div>')}
function dash(){
 const a=sum(S.tx,'in'),b=sum(S.tx,'out'),pct=Math.min(100,a/S.target*100);
 const tot=RT.map((n,i)=>S.tx.filter(x=>x.t=='in'&&x.rt==i).reduce((s,x)=>s+x.a,0));const mx=Math.max(...tot,1);
 const mon={};S.tx.forEach(x=>{const m=x.d.slice(0,7);mon[m]=mon[m]||{i:0,o:0};mon[m][x.t=='in'?'i':'o']+=x.a});
 const ms=Object.keys(mon).sort(),mm=Math.max(...ms.flatMap(m=>[mon[m].i,mon[m].o]),1);
 const last=[...S.tx].sort((x,y)=>x.d<y.d?1:-1).slice(0,10);
 return `<div class="card hero"><div class="k">Saldo Kas Saat Ini</div><div class="v">${rp(a-b)}</div></div>
 <div class="g2"><div class="card"><div class="k">Uang Masuk</div><div class="v in" style="font-size:18px">${rp(a)}</div></div>
 <div class="card"><div class="k">Uang Keluar</div><div class="v ot" style="font-size:18px">${rp(b)}</div></div></div>
 ${admin?`<button class="btn big" onclick="newTx('in')">+ Catat Pemasukan</button><button class="btn big out" onclick="newTx('out')">+ Catat Pengeluaran</button>`:''}
 <div class="card"><h2>Target Pembangunan</h2><div class="bar"><i style="width:${pct}%"></i></div>
 <div class="k" style="margin-top:6px">${rp(a)} dari ${rp(S.target)} (${pct.toFixed(1)}%)</div></div>
 <div class="card"><h2>Pemasukan per RT</h2>${RT.map((n,i)=>`<div class="rt2"><div class="t"><b>${n}</b><span>${rp(tot[i])}</span></div><div class="bar"><i style="width:${tot[i]/mx*100}%"></i></div></div>`).join('')}</div>
 <div class="card"><h2>Per Bulan</h2>${ms.map(m=>{const[y,mo]=m.split('-');return `<div style="margin:10px 0"><div class="k">${BL[mo-1]} ${y}</div>
 <div class="bar"><i style="width:${mon[m].i/mm*100}%"></i></div><div class="k in">Masuk ${rp(mon[m].i)}</div>
 <div class="bar"><i style="width:${mon[m].o/mm*100}%;background:var(--out)"></i></div><div class="k ot">Keluar ${rp(mon[m].o)}</div></div>`}).join('')}</div>
 <div class="card"><h2>10 Transaksi Terbaru</h2>${last.map(row).join('')}</div>`}
function row(x){return `<div class="item"><div><b>${esc(x.t=='in'?nm(x):x.n)}</b><small>${tgl(x.d)} · ${esc(x.c)}${x.t=='in'?' · '+RT[x.rt]:''}</small>${x.k?`<small>${esc(x.k)}</small>`:''}</div>
 <div style="text-align:right"><b class="${x.t=='in'?'in':'ot'}">${x.t=='in'?'+':'−'}${rp(x.a)}</b>${admin?`<br><button class="x" onclick="del('${x.id}')">Hapus</button>`:''}</div></div>`}
function list(t){
 const isIn=t=='in',l=S.tx.filter(x=>x.t==t).sort((a,b)=>a.d<b.d?1:-1);
 const form=!admin?'':!fo?`<button class="btn big ${isIn?'':'out'}" onclick="fo=true;render()">+ Catat ${isIn?'Pemasukan':'Pengeluaran'}</button>`:`<div class="card"><h2>${isIn?'Catat Pemasukan':'Catat Pengeluaran'}</h2>
 <label>Tanggal</label><input type="date" id="fd" value="${today()}">
 <label>Nominal (Rp)</label><input type="number" id="fa" inputmode="numeric" min="1" placeholder="1500000" oninput="document.getElementById('pv').textContent=this.value>0?rp(+this.value):''"><div class="prv" id="pv"></div>
 <label>${isIn?'Nama donatur':'Penerima / toko'}</label><input id="fn">
 ${isIn?`<label>RT asal</label><select id="fr">${RT.map((n,i)=>`<option value="${i}">${n}</option>`).join('')}</select>`:''}
 <label>Kategori</label><select id="fc">${(isIn?CI:CO).map(c=>`<option>${c}</option>`).join('')}</select>
 <label>Keterangan (boleh kosong)</label><input id="fk">
 ${isIn?`<label style="display:flex;gap:10px;align-items:center;color:var(--tx)"><input type="checkbox" id="fh" style="width:24px;height:24px"> Hamba Allah (nama disamarkan untuk warga)</label>`:''}
 <button class="btn big ${isIn?'':'out'}" style="margin-top:14px" onclick="add('${t}')">Simpan</button>
 <button class="btn big ghost" style="color:var(--pr);margin:0" onclick="fo=false;render()">Batal</button></div>`;
 return form+`<div class="card"><h2>Daftar ${isIn?'Pemasukan':'Pengeluaran'}</h2><div class="v ${isIn?'in':'ot'}" style="font-size:20px;margin-bottom:6px">${rp(sum(S.tx,t))}</div>${l.map(row).join('')||'<div class="k">Belum ada data.</div>'}</div>`}
async function add(t){
 const a=+document.getElementById('fa').value,n=document.getElementById('fn').value.trim(),d=document.getElementById('fd').value;
 if(!(a>0)||!n||!d){await info('Data belum lengkap','Tanggal, nominal (angka positif), dan nama wajib diisi.');return}
 if(t=='out'&&a>sum(S.tx,'in')-sum(S.tx,'out')&&!(await ask('Peringatan','Pengeluaran melebihi saldo kas. Tetap simpan?')))return;
 const r={tipe:t,tanggal:d,nominal:a,rt:t=='in'?+document.getElementById('fr').value:null,kategori:document.getElementById('fc').value,nama:n,keterangan:document.getElementById('fk').value.trim(),anonim:t=='in'&&document.getElementById('fh').checked};
 if(await db(()=>sb.from('transaksi').insert(r))){fo=false;await refresh()}}
async function del(id){if(await ask('Hapus transaksi','Hapus transaksi ini? Tidak bisa dibatalkan.')&&await db(()=>sb.from('transaksi').delete().eq('id',id)))await refresh()}
function lap(){
 const l=filt();let s=0;const a=sum(l,'in'),b=sum(l,'out');const cats=[...new Set([...CI,...CO])];
 const rows=l.map(x=>{s+=x.t=='in'?x.a:-x.a;return {x,s}}).reverse();
 const bt=(ic,tx,fn,g)=>`<button class="btn big ${g?'ghost':''}" ${g?'style="color:var(--pr)"':''} onclick="${fn}">${ic} ${tx}</button>`;
 return `<div class="card"><h2>Filter Laporan</h2><div class="row"><div><label>Dari</label><input type="date" value="${F.from}" onchange="F.from=this.value;render()"></div><div><label>Sampai</label><input type="date" value="${F.to}" onchange="F.to=this.value;render()"></div></div>
 <div class="row"><div><label>RT (pemasukan)</label><select onchange="F.rt=this.value;render()"><option value="">Semua</option>${RT.map((n,i)=>`<option value="${i}" ${F.rt!==''&&F.rt==i?'selected':''}>${n}</option>`).join('')}</select></div>
 <div><label>Kategori</label><select onchange="F.cat=this.value;render()"><option value="">Semua</option>${cats.map(c=>`<option ${F.cat==c?'selected':''}>${c}</option>`).join('')}</select></div></div></div>
 ${bt('📄','Simpan PDF','pdf()')}${bt('📊','Unduh Excel (CSV)','csv()',1)}${bt('💬','Bagikan ke WhatsApp','wa()',1)}
 <div class="card hero" style="margin-top:14px"><div class="k">Saldo periode ini</div><div class="v">${rp(a-b)}</div></div>
 <div class="g2"><div class="card"><div class="k">Masuk</div><div class="v in" style="font-size:18px">${rp(a)}</div></div><div class="card"><div class="k">Keluar</div><div class="v ot" style="font-size:18px">${rp(b)}</div></div></div>
 <div class="card"><h2>Buku Kas (${l.length} transaksi)</h2>${rows.map(r=>`<div class="item"><div><b>${esc(nm(r.x))}</b><small>${tgl(r.x.d)} · ${esc(r.x.c)}${r.x.t=='in'?' · '+RT[r.x.rt]:''}</small>${r.x.k?`<small>${esc(r.x.k)}</small>`:''}</div><div style="text-align:right"><b class="${r.x.t=='in'?'in':'ot'}">${r.x.t=='in'?'+':'−'}${rp(r.x.a)}</b><small>Saldo ${rp(r.s)}</small></div></div>`).join('')||'<div class="k">Tidak ada data.</div>'}</div>`}
async function saveFile(name,data,ft,fn,fx){
 let d=null;if(typeof claude!=='undefined')try{d=await claude.use('downloads')}catch(e){}
 if(!d){try{const u=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);return}catch(e){return fx?copyBox(ft,fn,fx):0}}
 try{await d.save({filename:name,data})}catch(e){if(!e||e.code!=='declined')info('Gagal menyimpan','Penyimpanan file tidak berhasil'+(e&&e.code?' ('+e.code+')':'')+'.')}}
function csv(){const l=filt();let s=0;const r=[['Tanggal','Jenis','Uraian','Kategori','RT','Keterangan','Masuk','Keluar','Saldo']];
 l.forEach(x=>{s+=x.t=='in'?x.a:-x.a;r.push([x.d,x.t=='in'?'Masuk':'Keluar',nm(x),x.c,x.t=='in'?RT[x.rt]:'',x.k||'',x.t=='in'?x.a:'',x.t=='out'?x.a:'',s])});
 saveFile('Buku-Kas-Masjid-'+today()+'.csv','\ufeff'+r.map(a=>a.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\n'),'Data untuk Excel / Google Sheets','Tekan Salin, lalu tempel (paste) di Excel atau Google Sheets.',r.map(a=>a.join('\t')).join('\n'))}
async function pdf(){
 const J=window.jspdf;if(!J||!J.jsPDF){info('PDF belum siap','Pustaka PDF gagal dimuat. Periksa koneksi internet, lalu muat ulang halaman.');return}
 const l=filt(),a=sum(l,'in'),b=sum(l,'out');const doc=new J.jsPDF({unit:'mm',format:'a4'});const W=doc.internal.pageSize.getWidth();
 doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text('PANITIA PEMBANGUNAN MASJID NURUL IMAN SENGGIGI',W/2,16,{align:'center'});
 doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Dusun Senggigi (RT 01 - RT 06)',W/2,22,{align:'center'});
 doc.setLineWidth(.5);doc.line(14,25,W-14,25);
 doc.setFont('helvetica','bold');doc.setFontSize(12);doc.text('LAPORAN BUKU KAS',W/2,33,{align:'center'});
 const per=(F.from||F.to)?'Periode: '+(F.from?tgl(F.from):'awal')+' s/d '+(F.to?tgl(F.to):'sekarang'):'Periode: seluruh transaksi';
 doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text(per+(F.rt!==''?'  |  '+RT[F.rt]:'')+(F.cat?'  |  '+F.cat:''),W/2,39,{align:'center'});
 let s=0;const B={fontStyle:'bold'};
 const body=l.map(x=>{s+=x.t=='in'?x.a:-x.a;return [tgl(x.d),nm(x)+'\n'+x.c+(x.k?' - '+x.k:''),x.t=='in'?num(x.a):'',x.t=='out'?num(x.a):'',num(s)]});
 body.push([{content:'TOTAL',colSpan:2,styles:B},{content:num(a),styles:B},{content:num(b),styles:B},{content:num(a-b),styles:B}]);
 doc.autoTable({startY:44,head:[['Tanggal','Uraian','Masuk (Rp)','Keluar (Rp)','Saldo (Rp)']],body,styles:{fontSize:8.5,cellPadding:2},headStyles:{fillColor:[21,115,71]},columnStyles:{2:{halign:'right'},3:{halign:'right'},4:{halign:'right'}}});
 let y=doc.lastAutoTable.finalY+14;if(y>245){doc.addPage();y=30}
 doc.setFontSize(10);doc.text('Senggigi, '+tgl(today()),W-14,y,{align:'right'});y+=8;
 ['Ketua','Sekretaris','Bendahara'].forEach((n,i)=>{const x=W/6+i*W/3;doc.text(n,x,y,{align:'center'});doc.text('(______________)',x,y+26,{align:'center'})});
 const pc=doc.internal.getNumberOfPages();for(let i=1;i<=pc;i++){doc.setPage(i);doc.setFontSize(8);doc.text('Halaman '+i+' dari '+pc,W/2,290,{align:'center'})}
 saveFile('Laporan-Kas-Masjid-'+today()+'.pdf',doc.output('blob'))}
function dl(n,c,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c],{type:t}));a.download=n;a.click()}
function wa(){const a=sum(S.tx,'in'),b=sum(S.tx,'out');
 const t=`*LAPORAN KAS MASJID NURUL IMAN SENGGIGI*\n${tgl(today())}\n\nTotal masuk: ${rp(a)}\nTotal keluar: ${rp(b)}\n*Saldo: ${rp(a-b)}*\n\nPemasukan per RT:\n`+
 RT.map((n,i)=>n+': '+rp(S.tx.filter(x=>x.t=='in'&&x.rt==i).reduce((s,x)=>s+x.a,0))).join('\n')+'\n\nJazakumullahu khairan.';
 copyBox('Bagikan ke WhatsApp','Salin teks ini, atau tekan tombol hijau untuk membuka WhatsApp.',t,'https://wa.me/?text='+encodeURIComponent(t))}
function set(){return `<div class="card"><h2>Pengaturan</h2><label>Target dana pembangunan (Rp)</label><input type="number" value="${S.target}" onchange="setTarget(this.value)">
 <label>Ganti kata sandi bendahara</label><input type="password" placeholder="Kata sandi baru (min. 8 karakter)" onchange="setPass(this.value)"></div>
 <div class="card"><h2>Cadangan Data</h2><button class="btn big" onclick="backup()">Simpan Backup (file)</button><p class="k">Disarankan simpan backup setiap bulan.</p></div>`}
async function setTarget(v){v=+v;if(!(v>0))return;if(await db(()=>sb.from('pengaturan').upsert({id:1,target:v})))await refresh()}
async function setPass(v){if(v.length<8){info('Terlalu pendek','Kata sandi minimal 8 karakter.');return}if(await db(()=>sb.auth.updateUser({password:v})))info('Berhasil','Kata sandi sudah diganti.')}
function backup(){const j=JSON.stringify(S.tx,null,1);saveFile('Backup-Kas-Masjid-'+today()+'.json',j,'Backup Data','Tekan Salin, lalu simpan teks ini.',j)}
render();init();
</script>
